<title>Goblin Maze Defense</title>

<style>
:root{
  --bg:#1c1a12;
  --surround:#2c2a1c;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0b0d09;--surround:#171a12;color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#0b0d09;--surround:#171a12;color-scheme:dark;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
body{height:100%;margin:0;background:var(--bg);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
#wrap{height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,var(--surround),var(--bg));}
canvas{display:block;touch-action:none;max-width:100%;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5);}
</style>

const SPR = {}, TINT = {}, OUT = {};
const OPAD = 3;
function outlined(im){
  const c = document.createElement('canvas'); c.width = im.width + OPAD * 2; c.height = im.height + OPAD * 2;
  const g = c.getContext('2d'), sil = tintOf(im, '#1a1006');
  for(let k = 0; k < 12; k++){ const a = k / 12 * 6.283; g.drawImage(sil, OPAD + Math.cos(a) * 2.4, OPAD + Math.sin(a) * 2.4); }
  g.drawImage(im, OPAD, OPAD); return c;
}

function gunGeom(g){
  const d = GUNS[g.t], im = SPR[d.id]; if(!im) return null;
  const w = 38, h = w * im.height / im.width, bottom = g.y + 16, m = TMETA[d.id], face = m[2] ? 1 : (g.face || 1);
  return { w, h, bottom, face, mx:g.x + face * (m[0] - 0.5) * w, my:bottom - h + m[1] * h };
}
const GDH = { grunt:34, runner:34, shield:38, brute:46, shaman:42, wolf:42, splitter:46, boss:64 };
function tintOf(im, col){
  const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
  const g = c.getContext('2d'); g.drawImage(im, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height); return c;
}
(function loadSprites(){
  const keys = Object.keys(SPR_DATA); let left = keys.length;
  const done = () => {
    if(--left > 0) return;
    for(const k in GDH) if(SPR[k]){
      const o = outlined(SPR[k]); OUT[k] = o;
      TINT[k] = { white:tintOf(o, '#ffffff'), ice:tintOf(o, '#9fe8ff'), red:tintOf(o, '#ff3020') };
    }
    renderBG(bgMenu, menuMaze); if(maze) renderBG(bgPlay, maze);
  };
  keys.forEach(k => { const im = new Image(); im.onload = () => { SPR[k] = im; done(); }; im.onerror = done; im.src = SPR_DATA[k]; });
})();
function drawSpr(b, k, cx, bottom, h){
  const im = SPR[k]; if(!im) return 0;
  const w = h * im.width / im.height; b.drawImage(im, cx - w / 2, bottom - h, w, h); return w;
}
function sprShadow(b, cx, y, rx, ry, a){ b.fillStyle = `rgba(20,10,0,${a || 0.32})`; b.beginPath(); b.ellipse(cx, y, rx, ry, 0, 0, 6.283); b.fill(); }

const MAZES = [
  { name:'Mossy Bend',    wp:[[4,-1],[4,2],[1,2],[1,6],[7,6],[7,10],[4,10],[4,13]] },
  { name:'Zigzag Ravine', wp:[[1,-1],[1,3],[7,3],[7,6],[1,6],[1,9],[7,9],[7,13]] },
  { name:'Twin Towers',   wp:[[1,-1],[1,10],[4,10],[4,2],[7,2],[7,13]] },
  { name:'Serpent Trail', wp:[[0,-1],[0,1],[8,1],[8,4],[0,4],[0,7],[8,7],[8,10],[0,10],[0,13]] },
  { name:'Crooked Keep',  wp:[[4,-1],[4,1],[2,1],[2,4],[6,4],[6,7],[2,7],[2,10],[6,10],[6,13]] },
  { name:'Goblin Rush',   wp:[[8,-1],[8,5],[1,5],[1,8],[5,8],[5,13]] },
];
const WAVES = 8;

function buildMaze(i){
  const m = MAZES[i], path = new Set(), pts = [];
  for(let k = 0; k < m.wp.length; k++){
    const [c, r] = m.wp[k];
    pts.push({ x:c * T + T / 2, y:MY + r * T + T / 2 });
    if(k > 0){
      const [pc, pr] = m.wp[k - 1];
      const dc = Math.sign(c - pc), dr = Math.sign(r - pr);
      let cc = pc, rw = pr;
      for(;;){
        if(rw >= 0 && rw < ROWS) path.add(cc + ',' + rw);
        if(cc === c && rw === r) break;
        cc += dc; rw += dr;
      }
    }
  }
  const segs = []; let total = 0;
  for(let k = 1; k < pts.length; k++){ const L = Math.hypot(pts[k].x - pts[k-1].x, pts[k].y - pts[k-1].y); segs.push(L); total += L; }
  const wall = new Set(), scenery = new Set();
  for(let r = 0; r < ROWS; r++) for(let c = 0; c < COLS; c++){
    const k = c + ',' + r; if(path.has(k)) continue;
    let adj = false;
    for(let dr = -1; dr <= 1 && !adj; dr++) for(let dc = -1; dc <= 1; dc++) if(path.has((c + dc) + ',' + (r + dr))){ adj = true; break; }
    (adj ? wall : scenery).add(k);
  }
  return { idx:i, path, wall, scenery, pts, segs, total, name:m.name, wp:m.wp, smoke:[] };
}
let maze = null;
const menuMaze = buildMaze(0);
function posAt(d){
  const P = maze.pts;
  for(let k = 0; k < maze.segs.length; k++){
    const L = maze.segs[k];
    if(d <= L){ const t = d / L; return { x:P[k].x + (P[k+1].x - P[k].x) * t, y:P[k].y + (P[k+1].y - P[k].y) * t }; }
    d -= L;
  }
  const e = P[P.length - 1]; return { x:e.x, y:e.y };
}

const TREE_PAL = [
  ['#7a2f10', '#c8581c', '#f19a3e'],
  ['#62181a', '#ad3324', '#e3624a'],
  ['#6e5010', '#c08f22', '#efcb55'],
  ['#1d3440', '#2e5566', '#5a8a99'],
];
function drawTree(b, x, y, s, rnd){
  const pi = (rnd() * TREE_PAL.length) | 0, pal = TREE_PAL[pi];
  b.fillStyle = 'rgba(0,0,0,.3)'; b.beginPath(); b.ellipse(x + 3 * s, y + 1.5 * s, 9 * s, 3.5 * s, 0, 0, 6.283); b.fill();
  b.fillStyle = '#4a2e18'; b.fillRect(x - 1.5 * s, y - 7 * s, 3 * s, 8 * s);
  if(pi === 3){
    for(let k = 0; k < 3; k++){
      const yy = y - 5 * s - k * 5 * s, w = (9 - k * 2.3) * s;
      b.fillStyle = pal[0]; b.beginPath(); b.moveTo(x - w, yy); b.lineTo(x, yy - 9 * s); b.lineTo(x + w, yy); b.closePath(); b.fill();
      b.fillStyle = pal[1]; b.beginPath(); b.moveTo(x - w * 0.85, yy - 1); b.lineTo(x, yy - 9 * s); b.lineTo(x + w * 0.15, yy - 1); b.closePath(); b.fill();
      b.fillStyle = pal[2]; b.beginPath(); b.moveTo(x - w * 0.5, yy - 3 * s); b.lineTo(x - w * 0.1, yy - 7.5 * s); b.lineTo(x - w * 0.15, yy - 3 * s); b.closePath(); b.fill();
    }
  } else {
    const cy = y - 13 * s, blobs = [[0, 0, 8], [-5.5, 2.5, 6], [5.5, 2.5, 6], [0, -5, 6.5]];
    b.fillStyle = pal[0]; blobs.forEach(([dx, dy, r]) => { b.beginPath(); b.arc(x + dx * s, cy + dy * s + 1.8 * s, r * s, 0, 6.283); b.fill(); });
    b.fillStyle = pal[1]; blobs.forEach(([dx, dy, r]) => { b.beginPath(); b.arc(x + dx * s - 0.8 * s, cy + dy * s, r * s * 0.86, 0, 6.283); b.fill(); });
    b.fillStyle = pal[2]; [[-3, -4.5, 3.2], [2.5, -6.5, 2.4], [-6.5, 0.5, 2.1], [4, 0, 1.6]].forEach(([dx, dy, r]) => { b.beginPath(); b.arc(x + dx * s, cy + dy * s, r * s, 0, 6.283); b.fill(); });
  }
}
function drawHouse(b, x, y, rnd, mz){

  b.fillStyle = 'rgba(0,0,0,.12)'; b.fillRect(cx - w / 2, base - 3, w, 3);
  b.fillStyle = '#6b4527'; b.fillRect(cx - w / 2, ry, w, 1.5); b.fillRect(cx - w / 2, ry, 1.5, hw); b.fillRect(cx + w / 2 - 1.5, ry, 1.5, hw);
  b.fillStyle = '#5a3418'; rr(cx - 3, base - 7.5, 6, 7.5, 2, b); b.fill();

function wallTile(b, c, r, mz, rnd){
  const x = c * T, y = MY + r * T, isW = (cc, rw) => mz.wall.has(cc + ',' + rw);
  const down = isW(c, r + 1), up = isW(c, r - 1), left = isW(c - 1, r), right = isW(c + 1, r);
  const fh = down ? 0 : 12, topH = T - fh, v = rnd() * 6 - 3;
  if(!down){ const sg = b.createLinearGradient(0, y + T, 0, y + T + 9); sg.addColorStop(0, 'rgba(20,10,0,.45)'); sg.addColorStop(1, 'rgba(20,10,0,0)'); b.fillStyle = sg; b.fillRect(x + 2, y + T, T + (right ? 0 : 3), 9); }
  if(!right){ const sg = b.createLinearGradient(x + T, 0, x + T + 6, 0); sg.addColorStop(0, 'rgba(20,10,0,.35)'); sg.addColorStop(1, 'rgba(20,10,0,0)'); b.fillStyle = sg; b.fillRect(x + T, y + 4, 6, T); }
  // top face: mortar + slabs
  b.fillStyle = '#4b515c'; b.fillRect(x, y, T, topH);
  const half = topH / 2, j1 = x + T * (0.3 + 0.4 * rnd()), j2 = x + T * (0.3 + 0.4 * rnd());
  const slabs = [[x, y, j1 - x, half], [j1, y, x + T - j1, half], [x, y + half, j2 - x, half], [j2, y + half, x + T - j2, half]];
  for(const [sx, sy, sw, sh] of slabs){
    const l = 55 + v + rnd() * 9;
    const g = b.createLinearGradient(sx, sy, sx, sy + sh);
    g.addColorStop(0, `hsl(${28 + rnd() * 14},10%,${l + 6}%)`); g.addColorStop(1, `hsl(30,9%,${l - 5}%)`);
    b.fillStyle = g; b.fillRect(sx + 0.6, sy + 0.6, sw - 1.2, sh - 1.2);
    b.fillStyle = 'rgba(255,255,255,.22)'; b.fillRect(sx + 0.6, sy + 0.6, sw - 1.2, 1);
    b.fillStyle = 'rgba(0,0,0,.12)'; b.fillRect(sx + 0.6, sy + sh - 1.6, sw - 1.2, 1);
  }
  for(let k = 0; k < 8; k++){ b.fillStyle = rnd() < 0.5 ? 'rgba(255,255,255,.18)' : 'rgba(30,35,45,.16)'; b.fillRect(x + 3 + rnd() * 33, y + 3 + rnd() * (topH - 6), 1.3, 1.3); }
  if(rnd() < 0.3){ for(let k = 0; k < 3; k++){ b.fillStyle = `hsla(${28 + rnd() * 20},70%,${55 + rnd() * 15}%,.55)`; b.beginPath(); b.arc(x + 4 + rnd() * 32, y + 3 + rnd() * (topH - 6), 1 + rnd() * 1.8, 0, 6.283); b.fill(); } }
  const lg = b.createLinearGradient(x, y, x + T, y + topH); lg.addColorStop(0, 'rgba(255,240,210,.16)'); lg.addColorStop(1, 'rgba(255,240,210,0)');
  b.fillStyle = lg; b.fillRect(x, y, T, topH);
  b.fillStyle = 'rgba(255,250,235,.55)';
  if(!up) b.fillRect(x, y, T, 1.5);
  if(!left) b.fillRect(x, y, 1.5, topH);
  b.fillStyle = 'rgba(14,16,22,.85)';
  if(!up) b.fillRect(x - (left ? 0 : 1), y - 1, T + (left ? 0 : 1) + (right ? 0 : 1), 1);
  if(!left) b.fillRect(x - 1, y, 1, T);
  if(!right) b.fillRect(x + T, y, 1, T);
  // front face: brick courses
  if(fh){
    b.fillStyle = '#23272e'; b.fillRect(x, y + topH, T, fh);
    for(let row = 0; row < 2; row++){
      let bx = x - (row ? 7 : 0) - (c % 2) * 4;
      const by = y + topH + row * fh / 2;
      while(bx < x + T){
        const bw = 9 + rnd() * 6, x0 = Math.max(x, bx), x1 = Math.min(x + T, bx + bw);
        if(x1 - x0 > 1.5){
          const l = 42 + rnd() * 10 - row * 6;
          const g = b.createLinearGradient(0, by, 0, by + fh / 2);
          g.addColorStop(0, `hsl(215,9%,${l + 6}%)`); g.addColorStop(1, `hsl(215,10%,${l - 6}%)`);
          b.fillStyle = g; b.fillRect(x0 + 0.5, by + 0.6, x1 - x0 - 1, fh / 2 - 1.2);
        }
        bx += bw;
      }

    b.fillStyle = 'rgba(10,12,16,.9)'; b.fillRect(x - (left ? 0 : 1), y + T, T + (left ? 0 : 1) + (right ? 0 : 1), 1);
  }
  if(!up){
    for(let k = 0; k < 3; k++){
      const mx = x + 3 + k * 13;
      const mg = b.createLinearGradient(0, y - 5, 0, y); mg.addColorStop(0, `hsl(215,9%,${82 + v}%)`); mg.addColorStop(1, `hsl(215,9%,${66 + v}%)`);
      b.fillStyle = mg; b.fillRect(mx, y - 5, 8, 5);
      b.fillStyle = 'rgba(14,16,22,.85)'; b.fillRect(mx - 0.5, y - 6, 9, 1); b.fillRect(mx - 0.5, y - 6, 1, 5); b.fillRect(mx + 8, y - 6, 1, 5);
    }
  }
}
function renderBG(cnv, mz){

  const gg = b.createLinearGradient(0, MY, 0, MB);
  gg.addColorStop(0, '#b7965a'); gg.addColorStop(1, '#957545'); b.fillStyle = gg; b.fillRect(0, MY, W, MH);

  }

        const v = rnd(), cx = xx + rnd() * 1.5, cy = yy + rnd() * 1.2, rw = 3.6 + rnd() * 0.8, rh = 2.7 + rnd() * 0.5;
        q.fillStyle = 'rgba(20,12,4,.55)'; q.beginPath(); q.ellipse(cx + 0.5, cy + 0.8, rw, rh, 0, 0, 6.283); q.fill();
        q.fillStyle = `hsl(${24 + v * 14},${12 + v * 12}%,${34 + v * 16}%)`; q.beginPath(); q.ellipse(cx, cy, rw, rh, 0, 0, 6.283); q.fill();
        q.fillStyle = 'rgba(255,235,200,.16)'; q.beginPath(); q.ellipse(cx - 0.9, cy - 0.9, rw * 0.5, rh * 0.4, 0, 0, 6.283); q.fill();
      }
    }

    q.beginPath(); P.forEach((p, i) => i ? q.lineTo(p.x, p.y) : q.moveTo(p.x, p.y)); q.stroke();

const paused = () => S.userPaused || S.sdkPaused;

const curStage = w => S.endless ? Math.min(5, Math.floor((w - 1) / 4)) : S.stage;
const hpMul = w => S.endless ? (1 + 0.2 * (w - 1)) * Math.pow(1.035, w - 1) : (1 + 0.35 * S.stage) * (1 + 0.22 * (w - 1));
const rewMul = w => S.endless ? 1 + 0.04 * (w - 1) : 1 + 0.15 * S.stage;
const isBossWave = w => S.endless ? w % 5 === 0 : w === WAVES;
const moreWaves = () => S.endless || S.wave < WAVES;
const earlyBonus = () => 15 + (S.wave + 1) * 5;

function startStage(i, keepScore, endless){
  maze = buildMaze(i);
  renderBG(bgPlay, maze);
  Object.assign(S, { stage:i, endless:!!endless, wave:0, cleared:0, waveActive:false, coins:1000, lives:LIVES, guns:[], enemies:[], fx:[], parts:[], queue:[],
    selType:-1, selGun:null, replace:false, userPaused:false, screen:'play', shake:0, hurtT:0, nextT:0, started:false, banner:null, coinPulse:0,
    meteorCD:0, aiming:false, meteors:[], stars:0 });
  if(!keepScore){ S.score = 0; S.kills = 0; }
  S.nextQ = makeWave(curStage(1), 1);
  flash('Build guns on the walls, then tap Start wave', 3);
}
function poolFor(st, w){
  const p = ['grunt'];
  if(st > 0 || w >= 2) p.push('runner');
  if(st > 0 || w >= 4) p.push('shield');
  if(st > 0 || w >= 5) p.push('brute');
  if(st >= 2 || (st === 1 && w >= 2)) p.push('shaman');
  if(st >= 3 || (st === 2 && w >= 2)) p.push('wolf');
  if(st >= 4 || (st === 3 && w >= 3)) p.push('splitter');
  return p;
}
function makeWave(st, w){
  const pool = poolFor(st, w), n = 10 + w * 3 + st * 3, q = [];
  const tot = pool.reduce((a, t) => a + WEIGHT[t], 0);
  for(let i = 0; i < n; i++){
    let r = Math.random() * tot, t = pool[0];
    for(const p of pool){ r -= WEIGHT[p]; if(r <= 0){ t = p; break; } }
    q.push(t);
  }
  if(isBossWave(w)){ q.push('boss'); if(st >= 3) q.push('boss'); }
  return q;
}
function startWave(){
  if(S.queue.length || !moreWaves()) return;
  if(S.waveActive && S.enemies.length){
    const b = earlyBonus(); S.coins += b; S.coinPulse = 0.25; flash('Called early! +' + b + ' coins', 1.5);
  }
  S.wave++;
  S.queue = S.nextQ || makeWave(curStage(S.wave), S.wave);
  S.nextQ = (S.endless || S.wave < WAVES) ? makeWave(curStage(S.wave + 1), S.wave + 1) : null;
  S.waveActive = true; S.spawnT = 0.3; S.started = true; S.nextT = 0;
  const label = S.endless ? 'Endless' : 'Stage ' + (S.stage + 1);
  S.banner = isBossWave(S.wave) ? { s:'Boss wave', sub:label, col:'#ff6b5a', t:0, dur:1.8 } : { s:'Wave ' + S.wave, sub:label, col:'#f4b942', t:0, dur:1.8 };
  const nt = S.queue.find(t => t !== 'grunt' && !save.seen.includes(t));
  if(nt){
    save.seen.push(nt); persist();
    S.banner.sub = 'New enemy: ' + GOB[nt].name + '. ' + GOB[nt].tip;
    S.banner.gob = nt; S.banner.dur = 3;
  }
}
function spawn(t, d){
  const g = GOB[t], st = curStage(Math.max(1, S.wave)), mul = hpMul(Math.max(1, S.wave)), p = posAt(d || 0);
  const e = { t, hp:g.hp * mul, max:g.hp * mul, spd:g.spd, d:d || 0, slowT:0, slowF:0, x:p.x, y:p.y, hitT:0, wob:Math.random() * 6, dir:1,
    armor:(g.armor || 0) * (1 + 0.5 * st), rew:Math.round(g.rew * rewMul(Math.max(1, S.wave))), abT:t === 'boss' ? 4 : 1.5 + Math.random(), rage:false, armorT:0 };
  S.enemies.push(e);
  if(t === 'boss'){ sfx('boss'); S.shake = 5; }
  return e;
}

/* ================= Particles ================= */
function burst(x, y, n, col, spd, size, max, kind, grav){
  for(let i = 0; i < n; i++){
    const a = Math.random() * 6.283, s = spd * (0.3 + Math.random() * 0.7);
    S.parts.push({ x, y, vx:Math.cos(a) * s, vy:Math.sin(a) * s, life:0, max:max * (0.6 + Math.random() * 0.4),
      size:size * (0.6 + Math.random() * 0.6), col, kind, g:grav || 0, rot:Math.random() * 6 });
  }
  if(S.parts.length > 450) S.parts.splice(0, S.parts.length - 450);
}

/* ================= Combat ================= */
function hurt(e, amt, pierce){
  if(e.dead) return;
  if(e.armor && !pierce){
    const red = Math.max(amt * 0.25, amt - e.armor);
    if(red < amt && e.armorT <= 0){ e.armorT = 0.12; burst(e.x + e.dir * 6, e.y, 2, '#e8eef5', 50, 1.2, 0.2, 'spark', 0); }
    amt = red;
  }
  e.hp -= amt; e.hitT = 0.08;
  if(e.hp <= 0){
    e.dead = true;
    const g = GOB[e.t];
    S.coins += e.rew; S.kills++; S.score += e.rew; S.coinPulse = 0.25;
    S.fx.push({ k:'die', x:e.x, y:e.y, gt:e.t, dir:e.dir, t:0, max:0.35 });
    S.fx.push({ k:'ring', x:e.x, y:e.y, r:18, col:'#fff4d0', t:0, max:0.25 });
    burst(e.x, e.y, 5, '#ffe27a', 70, 1.6, 0.4, 'spark', 0);
    burst(e.x, e.y, e.t === 'boss' ? 18 : 6, g.c[1], 90, 2.6, 0.5, 'gib', 260);
    burst(e.x, e.y, e.t === 'boss' ? 10 : 4, '#cfc8b8', 22, 7, 0.7, 'smoke', -20);
    S.fx.push({ k:'coin', x:e.x, y:e.y - 8, s:'+' + e.rew, t:0, max:0.9 });
    if(g.split){
      for(let k = 0; k < g.split; k++){ const c = spawn('runner', Math.max(0, e.d - 8 + k * 8)); c.hp = c.max = c.max * 0.6; c.rew = 2; }
      S.fx.push({ k:'ring', x:e.x, y:e.y, r:30, col:'#d8dc86', t:0, max:0.35 });
    }
    if(e.t === 'boss'){ S.shake = 8; S.fx.push({ k:'ring', x:e.x, y:e.y, r:60, col:'#f4b942', t:0, max:0.45 }); }
    sfx('kill');
  }
}
function fire(g, st, tg){
  const d = GUNS[g.t];
  g.ang = Math.atan2(tg.y - g.y, tg.x - g.x); g.recoil = 1;
  if(tg.x < g.x - 6) g.face = -1; else if(tg.x > g.x + 6) g.face = 1;
  const gm = gunGeom(g);
  const mx = gm ? gm.mx : g.x + Math.cos(g.ang) * 17, my = gm ? gm.my : g.y + Math.sin(g.ang) * 17;
  if(gm && d.id !== 'tesla' && d.id !== 'frost') S.fx.push({ k:'mflash', x:mx, y:my, face:gm.face, col:d.id === 'cannon' ? '#ffb347' : d.color, big:d.id === 'cannon' || d.id === 'sniper', t:0, max:d.id === 'rapid' ? 0.05 : 0.09 });
  if(gm && d.id === 'rapid') S.parts.push({ x:g.x, y:gm.my + 6, vx:-gm.face * (30 + Math.random() * 30), vy:-40 - Math.random() * 30, life:0, max:0.4, size:1.6, col:'#e0b04a', kind:'gib', g:320, rot:0 });
  if(gm && d.id === 'cannon') burst(mx, my, 4, '#8a8278', 18, 6, 0.7, 'smoke', -25);
  if(gm && d.id === 'sniper') burst(mx, my, 2, '#b8b0a8', 12, 4, 0.5, 'smoke', -15);
  if(d.id === 'cannon' || d.id === 'frost'){
    for(const e of S.enemies){
      if(e.dead) continue;
      if(Math.hypot(e.x - tg.x, e.y - tg.y) <= st.splash){
        hurt(e, st.dmg);
        if(st.slow){ e.slowF = Math.max(e.slowT > 0 ? e.slowF : 0, st.slow); e.slowT = 1.6; }
      }
    }
    if(d.id === 'cannon'){
      S.fx.push({ k:'shell', x1:mx, y1:my, x2:tg.x, y2:tg.y, t:0, max:0.12 });
      S.fx.push({ k:'flash', x:tg.x, y:tg.y, r:st.splash * 1.3, col:'#ff9a3d', t:0, max:0.28 });
      S.fx.push({ k:'ring', x:tg.x, y:tg.y, r:st.splash, col:'#ffc27a', t:0, max:0.3 });
      burst(tg.x, tg.y, 12, '#ffb347', 120, 2, 0.35, 'spark', 0);
      burst(tg.x, tg.y, 5, '#6b6258', 25, 8, 0.8, 'smoke', -25);
      S.fx.push({ k:'flash', x:mx, y:my, r:16, col:'#ffb347', t:0, max:0.08 });
    } else {
      S.fx.push({ k:'beam', x1:mx, y1:my, x2:tg.x, y2:tg.y, col:d.color, w:4, t:0, max:0.18 });
      S.fx.push({ k:'ring', x:tg.x, y:tg.y, r:st.splash, col:'#bff8ff', t:0, max:0.35 });
      burst(tg.x, tg.y, 8, '#c9fbff', 60, 2.5, 0.5, 'shard', 0);
    }
  } else if(d.id === 'tesla'){
    const hit = [tg]; let cur = tg;
    for(let i = 0; i < st.chain; i++){
      let best = null, bd = 70;
      for(const e of S.enemies){ if(e.dead || hit.includes(e)) continue; const dd = Math.hypot(e.x - cur.x, e.y - cur.y); if(dd < bd){ bd = dd; best = e; } }
      if(!best) break; hit.push(best); cur = best;
    }
    let px = mx, py = my;
    hit.forEach((e, i) => {
      S.fx.push({ k:'zap', pts:jag(px, py, e.x, e.y), col:d.color, t:0, max:0.2 });
      S.fx.push({ k:'flash', x:e.x, y:e.y, r:16, col:d.color, t:0, max:0.15 });
      hurt(e, st.dmg * Math.pow(0.8, i)); px = e.x; py = e.y;
    });
    burst(mx, my, 6, d.color, 70, 1.5, 0.25, 'spark', 0);
  } else {
    hurt(tg, st.dmg, d.id === 'sniper');
    if(d.id === 'sniper') S.fx.push({ k:'beam', x1:mx, y1:my, x2:tg.x, y2:tg.y, col:d.color, w:3, t:0, max:0.22 });
    else S.fx.push({ k:'bolt', x1:mx, y1:my, x2:tg.x, y2:tg.y, col:d.color, w:d.id === 'rapid' ? 1.6 : 2.6, t:0, max:d.id === 'rapid' ? 0.07 : 0.1 });
    S.fx.push({ k:'flash', x:mx, y:my, r:d.id === 'rapid' ? 10 : 14, col:d.color, t:0, max:0.07 });
    burst(tg.x, tg.y, d.id === 'sniper' ? 6 : 2, d.color, 70, 1.4, 0.25, 'spark', 0);
  }
}
function jag(x1, y1, x2, y2){
  const pts = [[x1, y1]], n = 6, dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
  for(let i = 1; i < n; i++){ const t = i / n, o = (Math.random() - 0.5) * 14; pts.push([x1 + dx * t - dy / L * o, y1 + dy * t + dx / L * o]); }
  pts.push([x2, y2]); return pts;
}

/* ================= Update ================= */
function update(dt){
  if(!S.waveActive && save.auto && S.nextT > 0){ S.nextT -= dt; if(S.nextT <= 0){ S.nextT = 0; startWave(); } }
  S.meteorCD = Math.max(0, S.meteorCD - dt);
  if(S.queue.length){
    S.spawnT -= dt;
    if(S.spawnT <= 0){ spawn(S.queue.shift()); S.spawnT = Math.max(0.3, 0.9 - S.wave * 0.05 - curStage(S.wave) * 0.04); }
  }
  for(const e of S.enemies){
    if(e.dead) continue;
    const g = GOB[e.t];
    let f = 1;
    if(e.slowT > 0){ e.slowT -= dt; f = 1 - e.slowF; if(e.slowT <= 0) e.slowF = 0; }
    e.d += e.spd * f * dt; e.ph = (e.ph || 0) + e.spd * f * dt * 0.2;
    if(e.hitT > 0) e.hitT -= dt;
    if(e.armorT > 0) e.armorT -= dt;
    if(g.heal){
      e.abT -= dt;
      if(e.abT <= 0){
        e.abT = 2.6;
        for(const o of S.enemies){
          if(o === e || o.dead || o.hp >= o.max) continue;
          if(Math.hypot(o.x - e.x, o.y - e.y) < 60){ o.hp = Math.min(o.max, o.hp + o.max * 0.12); S.fx.push({ k:'heal', x:o.x, y:o.y - 6, t:0, max:0.7 }); }
        }
        S.fx.push({ k:'ring', x:e.x, y:e.y, r:60, col:'#8dff9a', t:0, max:0.5 });
        sfx('heal');
      }
    }
    if(e.t === 'boss'){
      if(!e.rage && e.hp < e.max * 0.5){ e.rage = true; e.spd *= 1.6; S.shake = 6; flash('The Goblin King is enraged!', 1.6); }
      e.abT -= dt;
      if(e.abT <= 0){
        e.abT = e.rage ? 4 : 6;
        for(let k = 0; k < 2; k++){ const c = spawn('runner', Math.max(0, e.d - 10 - k * 9)); c.rew = 3; }
        S.fx.push({ k:'ring', x:e.x, y:e.y, r:40, col:'#ff6b5a', t:0, max:0.4 });
      }
    }
    if(e.d >= maze.total){
      e.dead = true; S.lives -= g.dmg; S.shake = 6; S.hurtT = 0.45;
      sfx('leak'); flash('A goblin got through!', 1.2); continue;
    }
    const p = posAt(e.d), dx = p.x - e.x;
    if(Math.abs(dx) > 0.01) e.dir = dx > 0 ? 1 : -1;
    e.x = p.x; e.y = p.y;
  }
  for(const g of S.guns){
    g.cd -= dt; g.recoil = Math.max(0, g.recoil - dt * 6);
    if(g.cd > 0) continue;
    const st = stats(g); let tg = null;
    for(const e of S.enemies){ if(e.dead) continue; if(Math.hypot(e.x - g.x, e.y - g.y) <= st.range && (!tg || e.d > tg.d)) tg = e; }
    if(tg){ fire(g, st, tg); g.cd = 1 / st.rate; g.idle = 0; }
    else { g.idle = (g.idle || 0) + dt; if(g.idle > 1.2) g.ang += dt * 0.6 * (g.c % 2 ? 1 : -1); }
  }
  for(const m of S.meteors){
    m.t += dt;
    if(m.t >= 0.55 && !m.done){
      m.done = true;
      const dmg = 150 * hpMul(Math.max(1, S.wave));
      for(const e of S.enemies) if(!e.dead && Math.hypot(e.x - m.x, e.y - m.y) <= 58) hurt(e, dmg, true);
      S.fx.push({ k:'flash', x:m.x, y:m.y, r:90, col:'#ff8a2a', t:0, max:0.4 });
      S.fx.push({ k:'ring', x:m.x, y:m.y, r:58, col:'#ffd08a', t:0, max:0.45 });
      S.fx.push({ k:'scorch', x:m.x, y:m.y, t:0, max:4 });
      burst(m.x, m.y, 26, '#ffb347', 170, 2.4, 0.6, 'spark', 0);
      burst(m.x, m.y, 10, '#5a5048', 35, 10, 1.1, 'smoke', -30);
      S.shake = 9; sfx('boom');
    }
  }
  S.meteors = S.meteors.filter(m => !m.done);
  S.enemies = S.enemies.filter(e => !e.dead);
  for(const f of S.fx) f.t += dt;
  S.fx = S.fx.filter(f => f.t < f.max);
  for(const p of S.parts){ p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.vx *= 1 - 2.5 * dt; p.rot += dt * 6; }
  S.parts = S.parts.filter(p => p.life < p.max);
  S.shake = Math.max(0, S.shake - dt * 30); S.hurtT = Math.max(0, S.hurtT - dt); S.coinPulse = Math.max(0, S.coinPulse - dt);
  if(S.banner){ S.banner.t += dt; if(S.banner.t > (S.banner.dur || 1.8)) S.banner = null; }

  if(S.lives <= 0){ S.lives = 0; endRun('over'); return; }
  if(S.waveActive && !S.queue.length && !S.enemies.length){
    S.waveActive = false; S.cleared = S.wave;
    if(!moreWaves()){ endRun(S.stage >= MAZES.length - 1 ? 'win' : 'clear'); return; }
    const bonus = 30 + S.wave * 5; S.coins += bonus;
    flash('Wave cleared! +' + bonus + ' coins'); sfx('wave');
    if(save.auto) S.nextT = 4;
  }
}
const starsFor = l => l >= 13 ? 3 : (l >= 7 ? 2 : 1);
function endRun(kind){
  S.screen = kind; S.selGun = null; S.selType = -1; S.aiming = false;
  if(S.endless){ save.endlessBest = Math.max(save.endlessBest, S.cleared); }
  else if(kind !== 'over'){
    S.stars = starsFor(S.lives);
    save.stars[S.stage] = Math.max(save.stars[S.stage] || 0, S.stars);
    save.unlocked = Math.min(MAZES.length, Math.max(save.unlocked, S.stage + 2));
  }
  save.best = Math.max(save.best, S.score);
  persist();
  sdk(y => y.engagement.sendScore({ value:Math.floor(S.score) }));
  sfx(kind === 'over' ? 'lose' : 'win');
}

/* ================= Save / load ================= */
async function loadSave(){
  let txt = null;
  try{ txt = YT ? await YT.game.loadData() : localStorage.getItem('gmd-save'); }catch(e){}
  if(txt){
    try{
      const o = JSON.parse(txt);
      save.unlocked = Math.min(MAZES.length, Math.max(1, o.unlocked | 0)); save.best = Math.max(0, o.best | 0);
      save.sound = o.sound !== false; save.auto = o.auto !== false;
      if(Array.isArray(o.stars)) save.stars = MAZES.map((m, i) => Math.max(0, Math.min(3, o.stars[i] | 0)));
      save.endlessBest = Math.max(0, o.endlessBest | 0);
      if(Array.isArray(o.seen)) save.seen = o.seen.filter(t => GOB[t]);
    }catch(e){}
  }
}
function persist(){
  const txt = JSON.stringify(save);
  try{ if(YT) sdk(y => y.game.saveData(txt)); else localStorage.setItem('gmd-save', txt); }catch(e){}
}

/* ================= Audio ================= */
let AC = null, sdkAudio = true; const lastS = {};
function initAudio(){
  if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state === 'suspended' && !S.sdkPaused) AC.resume().catch(() => {});
}
function tone(f, dur, type, vol, slide){
  const o = AC.createOscillator(), g = AC.createGain(), n = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, n);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, n + dur);
  g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(0.001, n + dur);
  o.connect(g).connect(AC.destination); o.start(n); o.stop(n + dur);
}
function sfx(k){
  if(!AC || !save.sound || !sdkAudio || S.sdkPaused) return;
  const now = performance.now(); if(lastS[k] && now - lastS[k] < 70) return; lastS[k] = now;
  try{
    switch(k){
      case 'kill':  tone(520, 0.08, 'square', 0.035, 260); break;
      case 'place': tone(300, 0.1, 'triangle', 0.08, 600); break;
      case 'up':    tone(400, 0.12, 'triangle', 0.08, 900); setTimeout(() => tone(900, 0.1, 'triangle', 0.06), 90); break;
      case 'sell':  tone(700, 0.1, 'triangle', 0.06, 350); break;
      case 'leak':  tone(160, 0.25, 'sawtooth', 0.07, 80); break;
      case 'boss':  tone(90, 0.6, 'sawtooth', 0.08, 60); break;
      case 'wave':  tone(500, 0.12, 'triangle', 0.07, 750); break;
      case 'win':   tone(520, 0.15, 'triangle', 0.08); setTimeout(() => tone(780, 0.25, 'triangle', 0.08), 140); break;
      case 'lose':  tone(300, 0.5, 'sawtooth', 0.07, 90); break;
      case 'no':    tone(140, 0.12, 'square', 0.05); break;
      case 'boom':  tone(120, 0.5, 'sawtooth', 0.1, 40); tone(60, 0.6, 'square', 0.06, 30); break;
      case 'whoosh':tone(900, 0.5, 'sine', 0.05, 200); break;
      case 'heal':  tone(660, 0.15, 'sine', 0.03, 990); break;
    }
  }catch(e){}
}

/* ================= UI widgets ================= */
let UI = [];
function btn(x, y, w, h, label, fn, o){
  o = o || {};
  const base = o.off ? '#3b382f' : (o.bg || C.gold), r = o.r == null ? 9 : o.r;
  rr(x, y + 2, w, h, r); ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fill();
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, o.off ? '#47443a' : shade(base, 0.25)); g.addColorStop(1, o.off ? '#33302a' : shade(base, -0.2));
  rr(x, y, w, h, r); ctx.fillStyle = g; ctx.fill();
  rr(x + 1, y + 1, w - 2, h * 0.45, Math.max(1, Math.min(r - 1, h * 0.22))); ctx.fillStyle = 'rgba(255,255,255,' + (o.off ? 0.04 : 0.18) + ')'; ctx.fill();
  rr(x + 0.5, y + 0.5, w - 1, h - 1, r); ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1; ctx.stroke();
  if(o.icon) o.icon(x + w / 2, y + h / 2);
  else text(label, x + w / 2, y + h / 2 + 1, o.font || ('700 14px ' + SANS), o.off ? '#8c8676' : (o.fg || C.ink), 'center');
  UI.push({ x, y, w, h, fn, off:!!o.off });

    overlay('Paused', [waveTxt],
      [['Menu', toMenu, { bg:'#5a503c', fg:C.parch }],
       [save.sound ? 'Sound on' : 'Sound off', () => { save.sound = !save.sound; persist(); }, { bg:'#5a503c', fg:C.parch }],
       ['Resume', () => { S.userPaused = false; }, { bg:'#6fcf43' }]], '#f4b942');
  } else if(S.screen === 'clear' || S.screen === 'win'){
    const win = S.screen === 'win';
    overlay(win ? 'Every maze defended' : 'Stage ' + (S.stage + 1) + ' cleared', ['', 'Lives left: ' + S.lives + ' of ' + LIVES, 'Score: ' + S.score],
      win ? [['Menu', toMenu, { bg:'#5a503c', fg:C.parch }], ['Endless', () => startStage(Math.floor(Math.random() * MAZES.length), false, true), { bg:'#b8472c', fg:'#fff3e0' }]]
          : [['Menu', toMenu, { bg:'#5a503c', fg:C.parch }], ['Retry', () => startStage(S.stage, false), { bg:C.gold }], ['Next', () => startStage(S.stage + 1, true), { bg:'#6fcf43' }]], '#7fdc4f');
    const bh = 150 + 3 * 24, by = (H - bh) / 2;
    starRow(W / 2, by + 86, S.stars, 11);
  } else if(S.screen === 'over'){
    if(S.endless)
      overlay('Endless run over', ['Waves survived: ' + S.cleared, 'Score: ' + S.score, 'Best run: ' + save.endlessBest + ' waves'],
        [['Menu', toMenu, { bg:'#5a503c', fg:C.parch }], ['Try again', () => startStage(S.stage, false, true), { bg:C.gold }]], '#e5533f');
    else
      overlay('The goblins broke through', [waveTxt, 'Score: ' + S.score, 'Best: ' + save.best],
        [['Menu', toMenu, { bg:'#5a503c', fg:C.parch }], ['Try again', () => startStage(S.stage, false), { bg:C.gold }]], '#e5533f');
  }
}

/* ================= Input ================= */
function tapMap(x, y){
  if(y < MY || y >= MB) return;
  if(S.aiming){ S.meteors.push({ x, y, t:0 }); S.aiming = false; S.meteorCD = METEOR_CD; sfx('whoosh'); return; }
  const c = Math.floor(x / T), r = Math.floor((y - MY) / T), g = gunAt(c, r);
  if(g){ S.selGun = g; S.replace = false; S.selType = -1; return; }
  if(maze.path.has(c + ',' + r)){ flash('Guns go on the walls, not the road'); return; }
  if(!maze.wall.has(c + ',' + r)){ flash('Build on the stone walls beside the road'); return; }
  if(S.selType < 0){ flash('Pick a gun from the bar below'); return; }
  const d = GUNS[S.selType];
  if(S.coins < d.cost){ flash('Not enough coins for ' + d.name); sfx('no'); return; }
  S.coins -= d.cost;
  const ng = { t:S.selType, c, r, x:c * T + T / 2, y:MY + r * T + T / 2 - (maze.wall.has(c + ',' + (r + 1)) ? 0 : 6), lv:1, spent:d.cost, cd:0, ang:-Math.PI / 2, recoil:0, face:(maze.path.has((c - 1) + ',' + r) || maze.path.has((c - 1) + ',' + (r + 1)) || maze.path.has((c - 1) + ',' + (r - 1))) && !maze.path.has((c + 1) + ',' + r) ? -1 : 1 };
  S.guns.push(ng);
  S.fx.push({ k:'ring', x:ng.x, y:ng.y, r:24, col:d.color, t:0, max:0.35 });
  burst(ng.x, ng.y + 8, 6, '#a89a80', 30, 5, 0.5, 'smoke', -15);
  sfx('place');
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  const rc = cv.getBoundingClientRect();
  const x = (e.clientX - rc.left) / rc.width * W, y = (e.clientY - rc.top) / rc.height * H;
  for(let i = UI.length - 1; i >= 0; i--){
    const b = UI[i];
    if(x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h){ if(!b.off) b.fn(); return; }
  }
  if(S.screen === 'play' && !paused()) tapMap(x, y);
});
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if(document.hidden && S.screen === 'play') S.userPaused = true; });

/* ================= Resize ================= */
function resize(){
  const wr = document.getElementById('wrap');
  const s = Math.min(wr.clientWidth / W, wr.clientHeight / H), d = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.style.width = Math.floor(W * s) + 'px'; cv.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.floor(W * s * d); cv.height = Math.floor(H * s * d);
  PR = s * d; ctx.setTransform(PR, 0, 0, PR, 0, 0);
  renderBG(bgMenu, menuMaze);
  if(maze) renderBG(bgPlay, maze);
}
let rzT = 0;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(resize, 120); });
resize();

/* ================= SDK events ================= */
sdk(y => {
  sdkAudio = y.system.isAudioEnabled();
  y.system.onAudioEnabledChange(v => { sdkAudio = v; });
  y.system.onPause(() => { S.sdkPaused = true; if(AC) AC.suspend().catch(() => {}); });
  y.system.onResume(() => { S.sdkPaused = false; if(AC && AC.state === 'suspended') AC.resume().catch(() => {}); });
});

/* ================= Loop ================= */
let last = performance.now(), first = true;
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if(!S.sdkPaused) animT += dt;
  if(S.screen === 'play' && !paused()){
    for(let i = 0; i < S.speed && S.screen === 'play'; i++) update(dt);
    if(S.msgT > 0) S.msgT -= dt;
  }
  draw();
  if(first){ first = false; sdk(y => y.game.firstFrameReady()); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
loadSave().then(() => sdk(y => y.game.gameReady()));
})();
</script>
